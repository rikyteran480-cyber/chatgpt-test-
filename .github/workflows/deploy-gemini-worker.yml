name: Deploy Gemini Worker

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Rama de pruebas que contiene el Worker"
        required: true
        type: choice
        options:
          - feat/gemini-original-documentary-engine

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy secure Gemini backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Falta CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Falta CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$GEMINI_API_KEY" || (echo "Falta GEMINI_API_KEY" && exit 1)
          npx --yes wrangler@4 deploy --config workers/gemini-documentary/wrangler.toml
          printf '%s' "$GEMINI_API_KEY" | npx --yes wrangler@4 secret put GEMINI_API_KEY --config workers/gemini-documentary/wrangler.toml
