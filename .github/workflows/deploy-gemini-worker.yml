name: Deploy Gemini Worker

on:
  push:
    branches:
      - main
      - feat/gemini-original-documentary-engine
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy secure Gemini backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npx --yes wrangler@4 deploy --config workers/gemini-documentary/wrangler.toml
          printf '%s' "$GEMINI_API_KEY" | npx --yes wrangler@4 secret put GEMINI_API_KEY --config workers/gemini-documentary/wrangler.toml
